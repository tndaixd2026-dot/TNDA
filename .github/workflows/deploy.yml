# 測試並部署網站到 GitHub Pages。
# 第一次使用前，請到 repo 的 Settings → Pages，把 Source 設為「GitHub Actions」。
# 同一個 Pages 網站也放期末提報「即時投資」（invest/），網址是 …/invest/。
name: 部署網站

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 測試與建置
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            invest/package-lock.json
      - run: npm ci
      - name: 型別檢查
        run: npm run typecheck
      - name: 單元測試
        run: npm test
      - name: 建置網站
        run: npm run build
      - name: 即時投資：安裝、型別檢查、測試
        working-directory: invest
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: 即時投資：建置到 dist/invest（連 deploy.config.json 設定的 Supabase）
        working-directory: invest
        run: npx vite build --outDir ../dist/invest --emptyOutDir
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          path: dist

  deploy:
    name: 發布到 GitHub Pages
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
